services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-cybersathi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-cybersathi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cybersathi}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cybersathi}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-cybersathi}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config worker --loglevel=info
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cybersathi}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-cybersathi}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: celery -A config beat --loglevel=info
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-cybersathi}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-cybersathi}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:8080"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    env_file: ../.env
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      DB_TYPE: postgresdb
      DB_POSTGRES_HOST: db
      DB_POSTGRES_PORT: 5432
      DB_POSTGRES_DATABASE: ${DB_NAME:-cybersathi}
      DB_POSTGRES_USER: ${DB_USER:-cybersathi}
      DB_POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n

volumes:
  pgdata:
  n8ndata:
