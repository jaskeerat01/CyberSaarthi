openapi: 3.0.3
info:
  title: Citizen CyberSathi API
  version: 1.0.0
  description: Versioned under /api/v1. Errors use RFC 9457 Problem Details.
servers:
  - url: http://localhost:8000
paths:
  /api/v1/scans:
    post:
      summary: Submit a scan (idempotent)
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [raw_content]
              properties:
                raw_content: { type: string, maxLength: 5000 }
                reported_financial_loss: { type: boolean, default: false }
                channel: { type: string, enum: [web, telegram], default: web }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, status]
                properties:
                  scan_id: { type: string, format: uuid }
                  status: { type: string }
                  reported_financial_loss: { type: boolean }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '429': { $ref: '#/components/responses/ProblemDetails' }
  /api/v1/scans/{scan_id}:
    get:
      summary: Get scan status and (when complete) assessment
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Scan detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
                  classification: { type: string, enum: [CONFIRMED_MALICIOUS, HIGH_RISK, SUSPICIOUS, NO_KNOWN_THREAT_DETECTED, INCONCLUSIVE] }
                  technical_evidence: { type: object }
                  social_engineering_evidence: { type: object }
                  confidence: { type: string }
                  rule_ids: { type: array, items: { type: string } }
                  ruleset_version: { type: string }
                  explanation_key: { type: string }
                  disclaimer: { type: string }
        '404': { $ref: '#/components/responses/ProblemDetails' }
    delete:
      summary: User-initiated deletion
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/ProblemDetails' }
  /api/v1/scans/{scan_id}/evidence:
    get:
      summary: Evidence detail
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Evidence
          content:
            application/json:
              schema:
                type: object
                properties:
                  indicators: { type: array, items: { type: object } }
                  observations: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/ProblemDetails' }
  /api/v1/scans/{scan_id}/report.pdf:
    get:
      summary: Generated on demand, served via short-lived signed URL
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed URL to PDF
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, format: uri }
                  expires_in: { type: integer }
        '404': { $ref: '#/components/responses/ProblemDetails' }
  /api/v1/telegram/webhook:
    post:
      summary: Telegram webhook (Phase 2)
      parameters:
        - name: X-Telegram-Bot-Api-Secret-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Accepted (deduplicated by update_id) }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '403': { $ref: '#/components/responses/ProblemDetails' }
        '503':
          description: Webhook secret is not configured; the endpoint fails closed.
  /internal/scans/{scan_id}/enrichment:
    post:
      summary: Internal — n8n posts observations (service-token auth, not public)
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                observations:
                  type: array
                  items:
                    type: object
                    required: [type, normalised_value, provider, outcome]
                    properties:
                      type: { type: string, enum: [URL, DOMAIN, IP, PHONE, UPI, EMAIL] }
                      normalised_value: { type: string, maxLength: 2048 }
                      provider: { type: string, maxLength: 64 }
                      outcome:
                        type: string
                        enum: [MATCH, NO_MATCH, ERROR, RATE_LIMITED, UNSUPPORTED]
                      response_reference: { type: string, maxLength: 500 }
                      error_detail: { type: string, maxLength: 500 }
      responses:
        '200': { description: Recorded }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '401': { $ref: '#/components/responses/ProblemDetails' }
        '404': { $ref: '#/components/responses/ProblemDetails' }
  /internal/scans/{scan_id}/complete:
    post:
      summary: Internal — mark enrichment done
      parameters:
        - name: scan_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [enrichment_done] }
      responses:
        '200': { description: Marked complete }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '401': { $ref: '#/components/responses/ProblemDetails' }
        '404': { $ref: '#/components/responses/ProblemDetails' }
  /internal/openphish/ingest:
    post:
      summary: Internal — n8n ingests the OpenPhish feed (service-token auth, not public)
      description: Stores feed digests locally every 12 hours; never queried per user request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                fetched_at: { type: string }
                urls:
                  type: array
                  maxItems: 10000
                  items: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Ingested
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: integer }
                  created: { type: integer }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '401': { $ref: '#/components/responses/ProblemDetails' }
  /internal/workflow-failures:
    post:
      summary: Internal — n8n Error Trigger reports a failed execution
      description: >
        Records execution metadata as a structured warning log. The n8n
        execution id lets operators inspect the failed run; error messages are
        not logged because they may contain submitted user content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workflow_name, execution_id]
              properties:
                workflow_name: { type: string, maxLength: 128 }
                execution_id: { type: string, maxLength: 64 }
                failed_node: { type: string, maxLength: 128 }
                error_message: { type: string, maxLength: 1000 }
                occurred_at: { type: string, maxLength: 64 }
      responses:
        '200': { description: Recorded }
        '400': { $ref: '#/components/responses/ProblemDetails' }
        '401': { $ref: '#/components/responses/ProblemDetails' }
components:
  responses:
    ProblemDetails:
      description: RFC 9457 Problem Details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
