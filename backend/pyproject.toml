[project]
name = "cybersathi"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.0,<5.2",
  "djangorestframework>=3.15",
  "drf-spectacular>=0.27",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "dj-database-url>=2.1",
  "django-environ>=0.11",
  "cryptography>=43",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "weasyprint>=61",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.0",
  "PyYAML>=6.0",
  "python-json-logger>=2.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "pytest-cov>=5.0",
  "factory-boy>=3.3",
  "ruff>=0.4",
  "mypy>=1.10",
  "bandit>=1.7",
  "pip-audit>=2.7",
  "testcontainers>=4.8",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "core*", "submissions*", "indicators*", "intel*", "assessment*", "reports*", "telegram*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing -q"

[tool.coverage.run]
source = [
  "config",
  "core",
  "submissions",
  "indicators",
  "intel",
  "assessment",
  "reports",
]
omit = ["*/migrations/*", "*/tests/*", "manage.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Django idiom: class Meta lists (indexes/constraints/ordering) and generated
# migrations are declarative, not runtime-mutable class state.
"*/migrations/*" = ["RUF012"]
"*/models.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
# Django/DRF have no bundled stubs; third-party types come from annotations.
# strict typing on all public code is enforced via type hints (spec §17);
# migrations and tests are exempt.
ignore_missing_imports = true
allow_untyped_decorators = true
follow_imports = "silent"
exclude = [
    "/migrations/",
    "/tests/",
    "\\.venv",
]
