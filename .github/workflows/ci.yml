name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # CI-only dummy values (see .env.example for real configuration)
      DJANGO_SECRET_KEY: ci-dummy-secret-key-32-chars-long!!
      IDENTIFIER_HMAC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      INTERNAL_SERVICE_TOKEN: ci-internal-service-token
      DATABASE_URL: sqlite:///ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy .
      - name: Django system checks
        run: python manage.py check
      - name: Validate OpenAPI schema (drf-spectacular)
        run: python manage.py spectacular --validate --file /tmp/schema.yaml
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80
      - run: bandit -r . -x "*/tests/*,*/migrations/*"
      - run: pip-audit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: semgrep --config auto --error
